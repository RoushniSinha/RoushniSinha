<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://w3.org" width="1020" height="400" viewBox="0 0 1020 400" role="img" aria-labelledby="title desc">
  <title id="title">Roushni Sinha developer banner</title>
  <desc id="desc">Punchy neo-brutalist developer banner with bold high-contrast text, expanded word spacing, animated tickers, floating stickers, and portrait card.</desc>

  <defs>
    <!-- Sharp Neo-Brutalist Solid Shadow Filter -->
    <filter id="brutalShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="6" dy="6" stdDeviation="0" flood-color="#000000" flood-opacity="1"/>
    </filter>

    <filter id="brutalShadowLg" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="8" dy="8" stdDeviation="0" flood-color="#000000" flood-opacity="1"/>
    </filter>

    <!-- Halftone / Dot Grid Pattern for Animated Background -->
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="2.2" fill="#000000" opacity="0.09"/>
    </pattern>

    <!-- Clip Path for Main Portrait -->
    <clipPath id="portraitClip">
      <rect x="690" y="44" width="276" height="312" rx="16" />
    </clipPath>
  </defs>

  <!-- 1. POP-ART YELLOW CANVAS & INNER CONTAINER -->
  <rect width="1020" height="400" rx="24" fill="#FFDE38" stroke="#000000" stroke-width="5"/>

  <!-- Animated Floating Retro Dot Pattern -->
  <rect x="6" y="6" width="1008" height="388" rx="20" fill="url(#dotGrid)">
    <animateTransform attributeName="transform" type="translate" values="0,0; 24,24; 0,0" dur="18s" repeatCount="indefinite"/>
  </rect>

  <!-- Top Rainbow Accent Stripe -->
  <rect x="6" y="6" width="1008" height="10" fill="#FF5E8E" stroke="#000000" stroke-width="2"/>
  <rect x="6" y="6" width="260" height="10" fill="#00D5FF"/>
  <rect x="266" y="6" width="260" height="10" fill="#7D7BFF"/>
  <rect x="526" y="6" width="260" height="10" fill="#00F298"/>

  <!-- ================= 2. ANIMATED TICKERS & FLOATING STICKERS ================= -->

  <!-- Ticker 1: "HELLO WORLD!" (Top Left) -->
  <g filter="url(#brutalShadow)">
    <g>
      <rect x="42" y="30" width="160" height="38" rx="8" fill="#00D5FF" stroke="#000000" stroke-width="3.5"/>
      <text x="122" y="55" text-anchor="middle" font-family="'Arial Black', 'Montserrat', sans-serif" font-size="13" font-weight="900" fill="#000000" letter-spacing="1.5" word-spacing="6">HELLO  WORLD!</text>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-5; 0,0" dur="3.2s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Ticker 2: "⚡ AUTONOMOUS AI" -->
  <g filter="url(#brutalShadow)">
    <g>
      <rect x="218" y="30" width="190" height="38" rx="8" fill="#FF7BD5" stroke="#000000" stroke-width="3.5"/>
      <text x="313" y="55" text-anchor="middle" font-family="'Arial Black', 'Montserrat', sans-serif" font-size="12.5" font-weight="900" fill="#000000" letter-spacing="1.2" word-spacing="6">⚡  AUTONOMOUS  AI</text>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,4; 0,0" dur="4s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Ticker 3: "🚀 FAST-MCP" -->
  <g filter="url(#brutalShadow)">
    <g>
      <rect x="424" y="30" width="154" height="38" rx="8" fill="#00F298" stroke="#000000" stroke-width="3.5"/>
      <text x="501" y="55" text-anchor="middle" font-family="'Arial Black', 'Montserrat', sans-serif" font-size="12.5" font-weight="900" fill="#000000" letter-spacing="1.2" word-spacing="5">🚀  FAST - MCP</text>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-4; 0,0" dur="3.8s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Ticker 4: "BUILD • SHIP • REPEAT" (Bottom Left) -->
  <g filter="url(#brutalShadow)">
    <g>
      <rect x="42" y="334" width="248" height="38" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="3.5"/>
      <text x="166" y="359" text-anchor="middle" font-family="'Arial Black', 'Montserrat', sans-serif" font-size="12.5" font-weight="900" fill="#000000" letter-spacing="1.5" word-spacing="8">BUILD  •  SHIP  •  REPEAT</text>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-3; 0,0" dur="4.5s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Ticker 5: "☁️ DISTRIBUTED SYSTEMS" (Bottom Middle) -->
  <g filter="url(#brutalShadow)">
    <g>
      <rect x="306" y="334" width="272" height="38" rx="8" fill="#FFA927" stroke="#000000" stroke-width="3.5"/>
      <text x="442" y="359" text-anchor="middle" font-family="'Arial Black', 'Montserrat', sans-serif" font-size="12.5" font-weight="900" fill="#000000" letter-spacing="1.5" word-spacing="8">☁️  DISTRIBUTED  SYSTEMS</text>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,4; 0,0" dur="3.6s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Star Sparkle 1 -->
  <g transform="translate(605, 48)">
    <path d="M 0,-14 L 4,-4 L 14,0 L 4,4 L 0,14 L -4,4 L -14,0 L -4,-4 Z" fill="#000000"/>
    <path d="M 0,-11 L 3,-3 L 11,0 L 3,3 L 0,11 L -3,3 L -11,0 L -3,-3 Z" fill="#FFFFFF"/>
    <animateTransform attributeName="transform" type="rotate" from="0 605 48" to="360 605 48" dur="10s" repeatCount="indefinite"/>
  </g>

  <!-- Star Sparkle 2 (Bottom Right Accent) -->
  <g transform="translate(635, 345)">
    <path d="M 0,-12 L 3,-3 L 12,0 L 3,3 L 0,12 L -3,3 L -12,0 L -3,-3 Z" fill="#000000"/>
    <path d="M 0,-9 L 2,-2 L 9,0 L 2,2 L 0,9 L -2,2 L -9,0 L -2,-2 Z" fill="#FF5E8E"/>
    <animateTransform attributeName="transform" type="rotate" from="360 635 345" to="0 635 345" dur="8s" repeatCount="indefinite"/>
  </g>

  <!-- ================= 3. HIGH-CONTRAST TYPOGRAPHY SECTION (SPACED) ================= -->

  <!-- Name Shadow Underlay with Extra Letter & Word Spacing -->
  <text x="48" y="148" font-family="'Arial Black', 'Montserrat', sans-serif" font-size="64" font-weight="900" fill="#000000" letter-spacing="4" word-spacing="16">ROUSHNI  SINHA</text>
  <text x="42" y="142" font-family="'Arial Black', 'Montserrat', sans-serif" font-size="64" font-weight="900" fill="#FFFFFF" letter-spacing="4" word-spacing="16">ROUSHNI  SINHA</text>
  <text x="42" y="142" font-family="'Arial Black', 'Montserrat', sans-serif" font-size="64" font-weight="900" fill="none" stroke="#000000" stroke-width="3" letter-spacing="4" word-spacing="16">ROUSHNI  SINHA</text>

  <!-- Role Badge Container (Wider Container + Spaced Text) -->
  <g filter="url(#brutalShadow)">
    <rect x="42" y="166" width="560" height="52" rx="10" fill="#000000"/>
    <rect x="44" y="168" width="556" height="48" rx="8" fill="#FF3366"/>
    <text x="322" y="199" text-anchor="middle" font-family="'Arial Black', 'Montserrat', sans-serif" font-size="18" font-weight="900" fill="#FFFFFF" letter-spacing="2.5" word-spacing="8">SOFTWARE  ENGINEER  •  SDE</text>
  </g>

  <!-- Readable Tagline Card with Open Word Spacing -->
  <g filter="url(#brutalShadow)">
    <rect x="42" y="230" width="560" height="88" rx="12" fill="#FFFFFF" stroke="#000000" stroke-width="3.5"/>
    <text x="62" y="264" font-family="'Trebuchet MS', 'Arial Black', sans-serif" font-size="19" font-weight="900" fill="#000000" letter-spacing="0.8" word-spacing="6">
      Building  resilient  cloud  +  AI  systems  with
    </text>
    <text x="62" y="296" font-family="'Trebuchet MS', 'Arial Black', sans-serif" font-size="19" font-weight="900" fill="#FF3366" letter-spacing="0.8" word-spacing="6">
      multi-agent  workflows  <tspan fill="#000000" word-spacing="6">&amp;  bold  product  energy.</tspan>
    </text>
  </g>

  <!-- ================= 4. PRIMARY PORTRAIT CARD ================= -->
  <g filter="url(#brutalShadowLg)">
    <!-- White Card Frame Background -->
    <rect x="690" y="44" width="276" height="312" rx="16" fill="#F8FAFC" stroke="#000000" stroke-width="4.5"/>
    <!-- Clean, High-Contrast Neo-Brutalist Character Vector Graphic -->
    <g clip-path="url(#portraitClip)">
      <rect x="690" y="44" width="276" height="312" fill="#7D7BFF"/>
      <circle cx="828" cy="170" r="65" fill="#00F298" stroke="#000000" stroke-width="4"/>
      <path d="M 740,320 C 740,240 916,240 916,320 Z" fill="#FF3366" stroke="#000000" stroke-width="4"/>
      <circle cx="810" cy="160" r="6" fill="#000000"/>
      <circle cx="846" cy="160" r="6" fill="#000000"/>
      <path d="M 815,190 Q 828,205 841,190" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
    </g>
  </g>
</svg>
