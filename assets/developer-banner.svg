<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="400" viewBox="0 0 1020 400" role="img" aria-labelledby="title desc">
  <title id="title">Roushni Sinha developer banner</title>
  <desc id="desc">Colorful neo-brutalist developer banner with profile portrait and collage cards.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7d7bff"/>
      <stop offset="38%" stop-color="#ff7bd5"/>
      <stop offset="70%" stop-color="#ffc95d"/>
      <stop offset="100%" stop-color="#7bf4d5"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="0" flood-color="#111" flood-opacity="1"/>
    </filter>
  </defs>

  <rect width="1020" height="400" rx="26" fill="url(#bg)"/>
  <rect x="14" y="14" width="992" height="372" rx="20" fill="#fffef7" stroke="#111" stroke-width="4"/>

  <g>
    <rect x="38" y="34" width="120" height="38" rx="10" fill="#00d5ff" stroke="#111" stroke-width="4"/>
    <text x="98" y="59" text-anchor="middle" font-family="'Arial Black', 'Montserrat', sans-serif" font-size="16" fill="#111">HELLO!</text>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -4; 0 0" dur="3.6s" repeatCount="indefinite"/>
  </g>

  <g>
    <rect x="548" y="306" width="120" height="42" rx="12" fill="#ffd861" stroke="#111" stroke-width="4"/>
    <text x="608" y="333" text-anchor="middle" font-family="'Arial Black', 'Montserrat', sans-serif" font-size="14" fill="#111">BUILD • SHIP</text>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 5; 0 0" dur="4.2s" repeatCount="indefinite"/>
  </g>

  <g fill="#111" font-family="'Arial Black', 'Montserrat', sans-serif">
    <text x="56" y="146" font-size="72" letter-spacing="1.5">ROUSHNI SINHA</text>
    <rect x="60" y="168" width="492" height="54" rx="14" fill="#ff6f91" stroke="#111" stroke-width="4"/>
    <text x="306" y="202" text-anchor="middle" font-size="26" fill="#111" letter-spacing="0.6">SDE • DISTRIBUTED ARCHITECTURES</text>
    <text x="58" y="262" font-family="'Trebuchet MS', 'Poppins', sans-serif" font-size="25" font-weight="700">Building resilient cloud + AI systems with</text>
    <text x="58" y="295" font-family="'Trebuchet MS', 'Poppins', sans-serif" font-size="25" font-weight="700">multi-agent workflows and bold product energy.</text>
  </g>

  <g filter="url(#cardShadow)">
    <rect x="676" y="46" width="292" height="318" rx="18" fill="#ffffff" stroke="#111" stroke-width="5"/>
    <rect x="624" y="238" width="214" height="138" rx="14" fill="#fffbe4" stroke="#111" stroke-width="5" transform="rotate(-8 731 307)"/>
  </g>

  <foreignObject x="624" y="46" width="344" height="330">
    <div xmlns="http://www.w3.org/1999/xhtml" style="position:relative;width:344px;height:330px;font-family:Arial,sans-serif;">
      <img
        src="https://raw.githubusercontent.com/RoushniSinha/RoushniSinha/main/assets/profile-photo.png.webp"
        alt="Portrait of Roushni Sinha"
        style="position:absolute;left:52px;top:8px;width:260px;height:302px;object-fit:cover;border:5px solid #111;border-radius:14px;background:#f8f8f8;" />
      <img
        src="https://raw.githubusercontent.com/RoushniSinha/RoushniSinha/main/assets/aesthetic-collage.png.jpg"
        alt="Aesthetic collage card"
        style="position:absolute;left:0px;top:198px;width:196px;height:122px;object-fit:cover;border:4px solid #111;border-radius:10px;background:#fff8e6;transform:rotate(-8deg);" />
    </div>
  </foreignObject>
</svg>
