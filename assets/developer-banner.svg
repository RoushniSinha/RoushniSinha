<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="title subtitle">
  <title id="title">Roushni Sinha developer banner</title>
  <desc id="subtitle">Minecraft-inspired animated village biome scene with developer title and subtitle.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#87ceeb"/>
      <stop offset="100%" stop-color="#cdefff"/>
    </linearGradient>
    <pattern id="dirt" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" fill="#8b5a2b"/>
      <rect width="12" height="12" fill="#7a4f25"/>
      <rect x="12" y="12" width="12" height="12" fill="#6b431f"/>
      <rect x="4" y="14" width="6" height="6" fill="#9c6a35"/>
      <rect x="14" y="4" width="6" height="6" fill="#9c6a35"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="320" fill="url(#sky)"/>

  <g opacity="0.9">
    <rect x="90" y="40" width="60" height="20" fill="#ffffff"/>
    <rect x="130" y="30" width="40" height="20" fill="#ffffff"/>
    <rect x="170" y="40" width="60" height="20" fill="#ffffff"/>
    <animateTransform attributeName="transform" type="translate" values="0 0; 20 0; 0 0" dur="12s" repeatCount="indefinite"/>
  </g>
  <g opacity="0.85">
    <rect x="840" y="52" width="58" height="18" fill="#ffffff"/>
    <rect x="876" y="42" width="38" height="18" fill="#ffffff"/>
    <rect x="914" y="52" width="58" height="18" fill="#ffffff"/>
    <animateTransform attributeName="transform" type="translate" values="0 0; -24 0; 0 0" dur="14s" repeatCount="indefinite"/>
  </g>

  <rect x="0" y="210" width="1200" height="26" fill="#5da349"/>
  <rect x="0" y="236" width="1200" height="84" fill="url(#dirt)"/>

  <g>
    <rect x="70" y="148" width="18" height="62" fill="#6d4c41"/>
    <rect x="44" y="126" width="70" height="22" fill="#2e7d32"/>
    <rect x="36" y="104" width="86" height="22" fill="#388e3c"/>
  </g>
  <g>
    <rect x="1080" y="152" width="16" height="58" fill="#6d4c41"/>
    <rect x="1056" y="130" width="64" height="22" fill="#2e7d32"/>
    <rect x="1048" y="108" width="80" height="22" fill="#388e3c"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="905" y="142" width="150" height="68" fill="#b98a4d"/>
    <polygon points="890,142 980,96 1070,142" fill="#8d6e63"/>
    <rect x="967" y="162" width="26" height="48" fill="#5d4037"/>
    <rect x="928" y="162" width="26" height="20" fill="#90caf9"/>
    <rect x="1006" y="162" width="26" height="20" fill="#90caf9"/>
  </g>

  <g>
    <rect x="240" y="176" width="26" height="34" fill="#c68642"/>
    <rect x="246" y="166" width="14" height="10" fill="#f1c27d"/>
    <animateTransform attributeName="transform" type="translate" values="0 0; 8 0; 0 0" dur="3s" repeatCount="indefinite"/>
  </g>

  <g fill="#f8f8f8" font-family="'Courier New', monospace" text-anchor="middle" filter="url(#shadow)">
    <text x="600" y="126" font-size="64" font-weight="700" letter-spacing="4">ROUSHNI SINHA</text>
    <text x="600" y="164" font-size="24" font-weight="600" letter-spacing="2">BIOME: VILLAGE • SDE &amp; DISTRIBUTED ARCHITECTURES</text>
  </g>
</svg>
