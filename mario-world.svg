<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-label="Roushni Sinha Mario world banner">
  <defs>
    <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#5c94fc"/>
      <stop offset="65%" stop-color="#f8d477"/>
      <stop offset="100%" stop-color="#dff1ff"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" x2="1">
      <stop offset="0%" stop-color="#00a800"/>
      <stop offset="100%" stop-color="#006800"/>
    </linearGradient>
    <style>
      .cloud { animation: drift 14s ease-in-out infinite alternate; }
      .coin { animation: coinPop 2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .mario { animation: run 0.8s ease-in-out infinite; }
      @keyframes drift { from { transform: translateX(0); } to { transform: translateX(22px); } }
      @keyframes coinPop { 0%, 100% { opacity: 0; transform: translateY(6px) scale(.8); } 50% { opacity: 1; transform: translateY(-18px) scale(1.1); } }
      @keyframes run { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(12px); } }
    </style>
  </defs>
  <rect width="900" height="220" fill="url(#sky)"/>
  <g class="cloud" fill="#fff" opacity=".9">
    <ellipse cx="120" cy="42" rx="42" ry="18"/>
    <ellipse cx="170" cy="34" rx="55" ry="22"/>
    <ellipse cx="220" cy="42" rx="46" ry="18"/>
    <ellipse cx="560" cy="46" rx="52" ry="18" opacity=".75"/>
  </g>
  <path d="M0 150 120 108 220 150 340 112 460 150 600 96 760 148 900 120v100H0Z" fill="url(#hill)"/>
  <path d="M0 178 140 164 260 180 390 156 540 178 700 160 900 180v40H0Z" fill="#0a9a28" opacity=".85"/>
  <g class="coin">
    <circle cx="405" cy="112" r="12" fill="#fcd116" stroke="#a96d00" stroke-width="3"/>
    <path d="m405 96 4 16-4 16-4-16Z" fill="#fff3a8"/>
  </g>
  <g class="mario" transform="translate(175 0)">
    <rect x="0" y="124" width="44" height="18" fill="#e52521"/>
    <rect x="9" y="106" width="26" height="18" fill="#f5cfa8"/>
    <rect x="13" y="92" width="18" height="16" fill="#e52521"/>
    <rect x="7" y="84" width="30" height="10" fill="#e52521"/>
    <rect x="3" y="142" width="13" height="18" fill="#0044cc"/>
    <rect x="29" y="142" width="13" height="18" fill="#0044cc"/>
    <rect x="0" y="158" width="19" height="9" fill="#6d4c41"/>
    <rect x="28" y="158" width="19" height="9" fill="#6d4c41"/>
  </g>
  <rect x="700" y="88" width="58" height="54" fill="#00a800"/>
  <rect x="710" y="78" width="38" height="18" fill="#00d900"/>
  <rect x="720" y="118" width="18" height="24" fill="#b87500"/>
  <rect y="198" width="900" height="22" fill="#d4872c"/>
  <rect y="194" width="900" height="6" fill="#6b3300"/>
</svg>
