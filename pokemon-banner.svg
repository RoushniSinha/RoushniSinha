  </g>

  <g fill="#111111" font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">
    <text x="800" y="170" font-size="64" font-weight="700" letter-spacing="2">ROUSHNI SINHA</text>
    <text x="800" y="235" font-size="28" font-weight="600" letter-spacing="3">POKÉMON TRAINER OF AUTONOMOUS AI SYSTEMS</text>
    <text x="800" y="285" font-size="20" font-weight="500" letter-spacing="1.2">Building resilient cloud backends, fast MCP tools, and production-grade multi-agent workflows</text>
  </g>

  <g fill="#ffffff" stroke="#111111" stroke-width="2" opacity="0.85">
    <path d="M220 182 l8 22 22 8-22 8-8 22-8-22-22-8 22-8z"/>
    <path d="M1350 236 l6 18 18 6-18 6-6 18-6-18-18-6 18-6z"/>
    <path d="M620 94 l5 14 14 5-14 5-5 14-5-14-14-5 14-5z"/>
    <path d="M990 334 l5 14 14 5-14 5-5 14-5-14-14-5 14-5z"/>
