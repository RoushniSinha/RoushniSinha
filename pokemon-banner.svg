<svg width="1600" height="420" viewBox="0 0 1600 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Roushni Sinha Pokémon-themed profile banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#f5f5f5"/>
      <stop offset="100%" stop-color="#111111"/>
    </linearGradient>
    <radialGradient id="spark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="1600" height="420" fill="url(#bg)"/>
  <rect y="208" width="1600" height="4" fill="#000000" opacity="0.75"/>

  <g opacity="0.45" filter="url(#soft)">
    <circle cx="180" cy="70" r="28" fill="url(#spark)"/>
    <circle cx="420" cy="130" r="24" fill="url(#spark)"/>
    <circle cx="860" cy="70" r="30" fill="url(#spark)"/>
    <circle cx="1160" cy="130" r="22" fill="url(#spark)"/>
    <circle cx="1450" cy="90" r="26" fill="url(#spark)"/>
    <circle cx="300" cy="320" r="22" fill="url(#spark)"/>
    <circle cx="760" cy="340" r="26" fill="url(#spark)"/>
    <circle cx="1240" cy="300" r="30" fill="url(#spark)"/>
  </g>

  <g stroke="#111" stroke-width="3" fill="none" opacity="0.7">
    <circle cx="128" cy="292" r="44"/>
    <line x1="84" y1="292" x2="172" y2="292"/>
    <circle cx="128" cy="292" r="10" fill="#fff"/>

    <circle cx="1470" cy="128" r="44"/>
    <line x1="1426" y1="128" x2="1514" y2="128"/>
